services:
  # ── Neo4j 知识图谱数据库 ──────────────────────
  neo4j:
    image: neo4j:5.26.29-community
    container_name: agenthub-neo4j
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库 ───────────────────────
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: agenthub-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kafka (CDC 消息队列，单节点 KRaft) ───────
  kafka:
    image: apache/kafka-native:4.1.2
    container_name: agenthub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kafka-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Python API 服务 ───────────────────────────
  api:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: agenthub-api
    ports:
      - "8080:8080"
    env_file:
      - ./python/.env
    environment:
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      NEO4J_URI: bolt://neo4j:7687
      CHROMA_HOST: chromadb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      UPLOAD_DIR: /app/uploads
      ASSET_DIR: /app/data/assets
      CATALOG_PATH: /app/data/catalog.sqlite3
      CHECKPOINT_PATH: /app/data/checkpoints.sqlite3
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python:/app
      - uploads:/app/uploads
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  chroma_data:
  uploads:
  api_data:
